name: Fix All 50 Repos (Stop Recursive Submodule Clones)

on:
  workflow_dispatch:

jobs:
  stop-recursive-clones:
    runs-on: ubuntu-latest
    steps:
      - name: Remove AVIS-DATALAKE submodule from the 50 repos & fix Pages
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Error: GH_PAT secret is missing."
            exit 1
          fi

          gh repo list mercwar \
            --limit 200 \
            --json name,defaultBranchRef,isEmpty,isArchived,isPrivate \
            --jq '.[] | select(.name != "AVIS-DATALAKE" and .isEmpty == false and .isArchived == false and .isPrivate == false) | "\(.name) \(.defaultBranchRef.name)"' \
          | while read -r name branch; do
              [ -z "$branch" ] || [ "$branch" = "null" ] && continue

              HEAD_SHA=$(gh api "repos/mercwar/${name}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null) || continue
              BASE_TREE=$(gh api "repos/mercwar/${name}/git/commits/${HEAD_SHA}" --jq '.tree.sha')

              # Check if AVIS-DATALAKE submodule exists in this repo's root tree
              HAS_DL=$(gh api "repos/mercwar/${name}/git/trees/${BASE_TREE}" \
                --jq '.tree[] | select(.path == "AVIS-DATALAKE") | .path' 2>/dev/null || true)

              if [ -z "$HAS_DL" ]; then
                echo "[$name] Clean (no AVIS-DATALAKE submodule)."
                continue
              fi

              echo "[$name] Removing recursive AVIS-DATALAKE submodule on $branch..."

              # Build new tree without AVIS-DATALAKE (setting sha: null deletes the entry via Git Data API)
              TREE_UPDATES='[{"path": "AVIS-DATALAKE", "mode": "160000", "type": "commit", "sha": null}]'

              # Clean AVIS-DATALAKE section out of .gitmodules if present
              GM=$(gh api "repos/mercwar/${name}/contents/.gitmodules?ref=${branch}" \
                --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || true)

              if [ -n "$GM" ]; then
                CLEAN_GM=$(echo "$GM" | awk '
                  /^\[submodule "AVIS-DATALAKE"\]/ { skip=1; next }
                  /^\[/ { skip=0 }
                  !skip { print }
                ')
                if [ -z "$(echo "$CLEAN_GM" | tr -d '[:space:]')" ]; then
                  # Delete .gitmodules if it is now empty
                  TREE_UPDATES=$(echo "$TREE_UPDATES" | jq '. + [{"path": ".gitmodules", "mode": "100644", "type": "blob", "sha": null}]')
                else
                  TREE_UPDATES=$(echo "$TREE_UPDATES" | jq --arg gm "$CLEAN_GM" '. + [{"path": ".gitmodules", "mode": "100644", "type": "blob", "content": $gm}]')
                fi
              fi

              NEW_TREE=$(jq -n \
                --arg base "$BASE_TREE" \
                --argjson tree "$TREE_UPDATES" \
                '{ base_tree: $base, tree: $tree }' \
                | gh api "repos/mercwar/${name}/git/trees" --input - --jq '.sha')

              NEW_COMMIT=$(jq -n \
                --arg msg "Remove recursive AVIS-DATALAKE submodule to stop 50-repo Pages clones" \
                --arg tree "$NEW_TREE" \
                --arg parent "$HEAD_SHA" \
                '{ message: $msg, tree: $tree, parents: [$parent] }' \
                | gh api "repos/mercwar/${name}/git/commits" --input - --jq '.sha')

              gh api -X PATCH "repos/mercwar/${name}/git/refs/heads/${branch}" -f sha="$NEW_COMMIT" >/dev/null
              echo "[$name] Fixed -> $NEW_COMMIT"
            done
