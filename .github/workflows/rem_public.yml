name: Reverse Clones in AVIS-DATALAKE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reverse-datalake-clones:
    runs-on: ubuntu-latest
    steps:
      - name: Remove linked repo entries and .gitmodules from AVIS-DATALAKE
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "Error: GH_PAT secret is missing."
            exit 1
          fi

          OWNER="mercwar"
          REPO="AVIS-DATALAKE"
          BRANCH="main"

          HEAD_SHA=$(gh api "repos/${OWNER}/${REPO}/git/ref/heads/${BRANCH}" --jq '.object.sha')
          BASE_TREE=$(gh api "repos/${OWNER}/${REPO}/git/commits/${HEAD_SHA}" --jq '.tree.sha')

          # 1. Remove every mode 160000 gitlink entry in AVIS-DATALAKE's root tree
          LINK_ITEMS=$(gh api "repos/${OWNER}/${REPO}/git/trees/${BASE_TREE}" \
            --jq '[.tree[] | select(.mode == "160000" or .type == "commit") | { path: .path, mode: "160000", type: "commit", sha: null }]')

          # 2. Remove .gitmodules if present so submodule cloning is reversed
          HAS_GM=$(gh api "repos/${OWNER}/${REPO}/git/trees/${BASE_TREE}" \
            --jq '.tree[] | select(.path == ".gitmodules") | .path' 2>/dev/null || true)

          if [ -n "$HAS_GM" ]; then
            LINK_ITEMS=$(echo "$LINK_ITEMS" | jq \
              '. + [{ path: ".gitmodules", mode: "100644", type: "blob", sha: null }]')
          fi

          ITEM_COUNT=$(echo "$LINK_ITEMS" | jq 'length')
          echo "Found ${ITEM_COUNT} items to remove in ${OWNER}/${REPO}@${BRANCH}."

          if [ "$ITEM_COUNT" -eq 0 ]; then
            echo "Nothing to reverse."
            exit 0
          fi

          NEW_TREE=$(jq -n \
            --arg base "$BASE_TREE" \
            --argjson tree "$LINK_ITEMS" \
            '{ base_tree: $base, tree: $tree }' | \
            gh api "repos/${OWNER}/${REPO}/git/trees" --input - --jq '.sha')

          NEW_COMMIT=$(jq -n \
            --arg msg "Reverse cloned repo links in AVIS-DATALAKE" \
            --arg tree "$NEW_TREE" \
            --arg parent "$HEAD_SHA" \
            '{ message: $msg, tree: $tree, parents: [$parent] }' | \
            gh api "repos/${OWNER}/${REPO}/git/commits" --input - --jq '.sha')

          gh api -X PATCH "repos/${OWNER}/${REPO}/git/refs/heads/${BRANCH}" -f sha="$NEW_COMMIT" >/dev/null
          echo "Done! Reversed entries on ${OWNER}/${REPO}@${BRANCH} -> ${NEW_COMMIT}"
