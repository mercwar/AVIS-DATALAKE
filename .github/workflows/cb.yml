name: Callback - Install AVIS-DATALAKE Folder Link in Public Repos

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: write

jobs:
  callback-link-datalake:
    runs-on: ubuntu-latest
    steps:
      - name: Install and verify AVIS-DATALAKE 160000 folder link in each public repo
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "Error: GH_PAT secret is missing."
            exit 1
          fi

          OWNER="mercwar"
          TARGET_REPO="AVIS-DATALAKE"
          TARGET_BRANCH="main"
          TARGET_URL="https://github.com{OWNER}/${TARGET_REPO}.git"

          # Resolve current HEAD SHA of AVIS-DATALAKE
          TARGET_SHA=$(gh api "repos/${OWNER}/${TARGET_REPO}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')
          if [ -z "$TARGET_SHA" ]; then
            echo "Error: Could not resolve ${OWNER}/${TARGET_REPO}@${TARGET_BRANCH} SHA."
            exit 1
          fi
          echo "Target ${TARGET_REPO}@${TARGET_BRANCH} SHA: ${TARGET_SHA}"

          GM_BLOCK=$(printf '[submodule "%s"]\n\tpath = %s\n\turl = %s\n\tbranch = %s\n' \
            "$TARGET_REPO" "$TARGET_REPO" "$TARGET_URL" "$TARGET_BRANCH")

          FAILED_COUNT=0
          UPDATED_COUNT=0
          OK_COUNT=0

          while IFS=$'\t' read -r name branch; do
            [ -z "$name" ] && continue
            [ "$name" = "$TARGET_REPO" ] && continue
            [ -z "$branch" ] || [ "$branch" = "null" ] && continue

            HEAD_SHA=$(gh api "repos/${OWNER}/${name}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null || true)
            if [ -z "$HEAD_SHA" ]; then
              echo "[$name] Skipped (could not read branch $branch)."
              continue
            fi

            BASE_TREE=$(gh api "repos/${OWNER}/${name}/git/commits/${HEAD_SHA}" --jq '.tree.sha')
            RAW_TREE=$(gh api "repos/${OWNER}/${name}/git/trees/${BASE_TREE}")

            # Check if a real directory/file named AVIS-DATALAKE blocks the 160000 link
            COLLISION=$(echo "$RAW_TREE" | jq -r '.tree[] | select(.path == "AVIS-DATALAKE" and .mode != "160000") | .mode')
            if [ -n "$COLLISION" ]; then
              echo "[$name] ERROR: Path 'AVIS-DATALAKE' already exists as mode $COLLISION (cannot overwrite with 160000 link)."
              FAILED_COUNT=$((FAILED_COUNT + 1))
              continue
            fi

            CURRENT_LINK_SHA=$(echo "$RAW_TREE" | jq -r '.tree[] | select(.path == "AVIS-DATALAKE" and .mode == "160000") | .sha')
            EXISTING_GM=$(gh api "repos/${OWNER}/${name}/contents/.gitmodules?ref=${branch}" \
              --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || true)

            # Build updated .gitmodules preserving any other submodules in that repo
            if [ -n "$EXISTING_GM" ]; then
              CLEAN_GM=$(printf '%s\n' "$EXISTING_GM" | awk '
                BEGIN { skip = 0 }
                /^\[submodule "AVIS-DATALAKE"\]/ { skip = 1; next }
                /^\[submodule / { skip = 0 }
                !skip { print }
              ')
              NEW_GM=$(printf '%s\n\n%s\n' "$CLEAN_GM" "$GM_BLOCK" | sed '/./,$!d')
            else
              NEW_GM=$(printf '%s\n' "$GM_BLOCK")
            fi

            # Skip if both the 160000 SHA and .gitmodules already match
            if [ "$CURRENT_LINK_SHA" = "$TARGET_SHA" ] && [ "$EXISTING_GM" = "$NEW_GM" ]; then
              echo "[$name] Already up to date -> $TARGET_SHA"
              OK_COUNT=$((OK_COUNT + 1))
              continue
            fi

            # Rebuild root tree preserving everything except old AVIS-DATALAKE gitlink, .gitmodules, and old AVIS-DATALAKE.md
            CLEAN_TREE=$(echo "$RAW_TREE" | jq \
              --arg tsha "$TARGET_SHA" \
              --arg gm "$NEW_GM" \
              '[.tree[] | select(.path != "AVIS-DATALAKE" and .path != ".gitmodules" and .path != "AVIS-DATALAKE.md") | {path, mode, type, sha}]
               + [
                 { path: "AVIS-DATALAKE", mode: "160000", type: "commit", sha: $tsha },
                 { path: ".gitmodules", mode: "100644", type: "blob", content: $gm }
               ]')

            NEW_TREE=$(jq -n --argjson tree "$CLEAN_TREE" '{ tree: $tree }' | \
              gh api "repos/${OWNER}/${name}/git/trees" --input - --jq '.sha' 2>/dev/null || true)
            if [ -z "$NEW_TREE" ]; then
              echo "[$name] ERROR creating Git tree."
              FAILED_COUNT=$((FAILED_COUNT + 1))
              continue
            fi

            NEW_COMMIT=$(jq -n \
              --arg msg "Link AVIS-DATALAKE folder into repository" \
              --arg tree "$NEW_TREE" \
              --arg parent "$HEAD_SHA" \
              '{ message: $msg, tree: $tree, parents: [$parent] }' | \
              gh api "repos/${OWNER}/${name}/git/commits" --input - --jq '.sha' 2>/dev/null || true)
            if [ -z "$NEW_COMMIT" ]; then
              echo "[$name] ERROR creating commit."
              FAILED_COUNT=$((FAILED_COUNT + 1))
              continue
            fi

            if ! gh api -X PATCH "repos/${OWNER}/${name}/git/refs/heads/${branch}" -f sha="$NEW_COMMIT" >/dev/null 2>&1; then
              echo "[$name] ERROR updating ref heads/${branch} (check GH_PAT permissions)."
              FAILED_COUNT=$((FAILED_COUNT + 1))
              continue
            fi

            # Verify live 160000 folder link on the repo
            VERIFY_SHA=$(gh api "repos/${OWNER}/${name}/git/trees/${NEW_TREE}" --jq '.tree[] | select(.path == "AVIS-DATALAKE" and .mode == "160000") | .sha')
            if [ "$VERIFY_SHA" = "$TARGET_SHA" ]; then
              echo "[$name] SUCCESS & VERIFIED -> AVIS-DATALAKE @ $VERIFY_SHA ($branch)"
              UPDATED_COUNT=$((UPDATED_COUNT + 1))
            else
              echo "[$name] FAIL: Verification mismatch after commit!"
              FAILED_COUNT=$((FAILED_COUNT + 1))
            fi
          done < <(
            gh repo list "$OWNER" \
              --visibility public \
              --limit 1000 \
              --json name,defaultBranchRef,isEmpty,isPrivate,isArchived \
              --jq '.[] | select(.isPrivate == false and .isEmpty == false and .isArchived == false) | [.name, (.defaultBranchRef.name // "main")] | @tsv'
          )

          echo "Summary: ${UPDATED_COUNT} updated, ${OK_COUNT} already current, ${FAILED_COUNT} failed."
          if [ "$FAILED_COUNT" -gt 0 ]; then
            exit 1
          fi
