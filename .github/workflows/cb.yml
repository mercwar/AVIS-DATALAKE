name: Link All Mercwar Repos Back to AVIS-DATALAKE

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

jobs:
  link-back-to-datalake:
    runs-on: ubuntu-latest
    steps:
      - name: Add AVIS-DATALAKE folder to every mercwar repo
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Error: GH_PAT secret is missing."
            exit 1
          fi

          AUTH_B64=$(printf "x-access-token:%s" "$GH_TOKEN" | base64 -w 0)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global http.https://github.com "AUTHORIZATION: basic ${AUTH_B64}"

          DATALAKE_URL="https://github.com/mercwar/AVIS-DATALAKE.git"
          DATALAKE_BRANCH=$(gh repo view mercwar/AVIS-DATALAKE --json defaultBranchRef --jq '.defaultBranchRef.name')

          gh repo list mercwar \
            --limit 200 \
            --json name,url,defaultBranchRef,isEmpty,isArchived \
            --jq '.[] | select(.name != "AVIS-DATALAKE" and .isEmpty == false and .isArchived == false) | "\(.name) \(.url) \(.defaultBranchRef.name)"' \
          | while read -r name url branch; do
              if [ -n "$branch" ] && [ "$branch" != "null" ]; then
                echo "Linking AVIS-DATALAKE into $name ($branch)..."
                WORKDIR=$(mktemp -d)
                git clone --depth 1 --branch "$branch" "$url" "$WORKDIR" || continue

                # Clean up any broken submodule entry from previous failed runs
                if git -C "$WORKDIR" config -f .gitmodules --get "submodule.AVIS-DATALAKE.url" >/dev/null 2>&1; then
                  CURRENT_SUB_URL=$(git -C "$WORKDIR" config -f .gitmodules --get "submodule.AVIS-DATALAKE.url")
                  if [ "$CURRENT_SUB_URL" != "$DATALAKE_URL" ]; then
                    git -C "$WORKDIR" submodule deinit -f "AVIS-DATALAKE" || true
                    git -C "$WORKDIR" rm -f "AVIS-DATALAKE" || true
                    rm -rf "$WORKDIR/.git/modules/AVIS-DATALAKE"
                  fi
                fi

                if ! git -C "$WORKDIR" config -f .gitmodules --get "submodule.AVIS-DATALAKE.url" >/dev/null 2>&1; then
                  git -C "$WORKDIR" submodule add -f -b "$DATALAKE_BRANCH" "$DATALAKE_URL" "AVIS-DATALAKE" || true
                fi

                git -C "$WORKDIR" submodule sync
                git -C "$WORKDIR" submodule update --init --remote || true
                git -C "$WORKDIR" add -A
                git -C "$WORKDIR" commit -m "Link AVIS-DATALAKE folder" || true
                git -C "$WORKDIR" push || true

                rm -rf "$WORKDIR"
              fi
            done
