name: Callback - Link AVIS-DATALAKE into Public Repos

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

jobs:
  callback-link-datalake:
    runs-on: ubuntu-latest
    steps:
      - name: Place AVIS-DATALAKE link in each public repo
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Error: GH_PAT secret is missing."
            exit 1
          fi

          LINK_CONTENT=$(printf '# AVIS-DATALAKE\n\nCentral AVIS Datalake Repository: https://github.com\n')

          gh repo list mercwar \
            --visibility public \
            --limit 200 \
            --json name,defaultBranchRef,isEmpty,isArchived \
            --jq '.[] | select(.name != "AVIS-DATALAKE" and .isEmpty == false and .isArchived == false) | "\(.name) \(.defaultBranchRef.name)"' \
          | while read -r name branch; do
              [ -z "$branch" ] || [ "$branch" = "null" ] && continue

              HEAD_SHA=$(gh api "repos/mercwar/${name}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null) || {
                echo "[$name] Skipped (could not read $branch)."
                continue
              }

              LAST_MSG=$(gh api "repos/mercwar/${name}/commits/${HEAD_SHA}" --jq '.commit.message' 2>/dev/null || true)
              if echo "$LAST_MSG" | grep -q "Link AVIS-DATALAKE repository"; then
                echo "[$name] Skipped (HEAD is already updated)."
                continue
              fi

              BASE_TREE=$(gh api "repos/mercwar/${name}/git/commits/${HEAD_SHA}" --jq '.tree.sha')
              RAW_TREE=$(gh api "repos/mercwar/${name}/git/trees/${BASE_TREE}")

              HAS_SUBMOD=$(echo "$RAW_TREE" | jq -r '.tree[] | select(.path == "AVIS-DATALAKE") | .path')
              HAS_GM=$(echo "$RAW_TREE" | jq -r '.tree[] | select(.path == ".gitmodules") | .path')

              EXISTING_LINK=$(gh api "repos/mercwar/${name}/contents/AVIS-DATALAKE.md?ref=${branch}" \
                --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || true)

              if [ -z "$HAS_SUBMOD" ] && [ -z "$HAS_GM" ] && [ "$EXISTING_LINK" = "$LINK_CONTENT" ]; then
                echo "[$name] Already linked on $branch."
                continue
              fi

              # Strip old 160000 AVIS-DATALAKE gitlink & .gitmodules, then place AVIS-DATALAKE.md
              CLEAN_TREE=$(echo "$RAW_TREE" | jq \
                --arg lc "$LINK_CONTENT" \
                '[.tree[] | select(.path != "AVIS-DATALAKE" and .path != ".gitmodules" and .path != "AVIS-DATALAKE.md") | {path, mode, type, sha}]
                 + [{path: "AVIS-DATALAKE.md", mode: "100644", type: "blob", content: $lc}]')

              NEW_TREE=$(jq -n --argjson tree "$CLEAN_TREE" '{ tree: $tree }' | \
                gh api "repos/mercwar/${name}/git/trees" --input - --jq '.sha') || {
                  echo "[$name] ERROR creating tree."
                  continue
                }

              NEW_COMMIT=$(jq -n \
                --arg msg "Link AVIS-DATALAKE repository" \
                --arg tree "$NEW_TREE" \
                --arg parent "$HEAD_SHA" \
                '{ message: $msg, tree: $tree, parents: [$parent] }' | \
                gh api "repos/mercwar/${name}/git/commits" --input - --jq '.sha') || {
                  echo "[$name] ERROR creating commit."
                  continue
                }

              if gh api -X PATCH "repos/mercwar/${name}/git/refs/heads/${branch}" -f sha="$NEW_COMMIT" >/dev/null; then
                echo "[$name] SUCCESS -> Linked AVIS-DATALAKE on $branch ($NEW_COMMIT)"
              else
                echo "[$name] ERROR updating $branch (check GH_PAT permissions)."
              fi
            done
