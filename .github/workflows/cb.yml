name: Callback - Install AVIS-DATALAKE Link in Public Repos

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: write

jobs:
  install-datalake-link:
    runs-on: ubuntu-latest
    steps:
      - name: Install and verify 1 AVIS-DATALAKE folder link in each public repo
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "Error: GH_PAT secret is missing."
            exit 1
          fi

          OWNER="mercwar"
          TARGET_REPO="AVIS-DATALAKE"
          TARGET_BRANCH="main"
          TARGET_URL="https://github.com{OWNER}/${TARGET_REPO}.git"

          # Resolve current HEAD SHA of AVIS-DATALAKE
          TARGET_SHA=$(gh api "repos/${OWNER}/${TARGET_REPO}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')
          if [ -z "$TARGET_SHA" ]; then
            echo "Error: Could not resolve ${OWNER}/${TARGET_REPO}@${TARGET_BRANCH} SHA."
            exit 1
          fi
          echo "Target ${TARGET_REPO}@${TARGET_BRANCH} SHA: ${TARGET_SHA}"

          GM_BLOCK=$(printf '[submodule "%s"]\n\tpath = %s\n\turl = %s\n\tbranch = %s\n' \
            "$TARGET_REPO" "$TARGET_REPO" "$TARGET_URL" "$TARGET_BRANCH")

          # Fetch up to 1000 public repos
          REPO_ROWS=$(gh repo list "$OWNER" \
            --visibility public \
            --limit 1000 \
            --json name,defaultBranchRef,isEmpty,isPrivate,isArchived \
            --jq '.[] | select(.isPrivate == false and .isEmpty == false and .isArchived == false) | [.name, (.defaultBranchRef.name // "main")] | @tsv')

          UPDATED_COUNT=0
          OK_COUNT=0
          FAILED_COUNT=0

          while IFS=$'\t' read -r name branch; do
            [ -z "$name" ] && continue
            [ "$name" = "$TARGET_REPO" ] && continue
            [ -z "$branch" ] || [ "$branch" = "null" ] && continue

            HEAD_SHA=$(gh api "repos/${OWNER}/${name}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null || true)
            if [ -z "$HEAD_SHA" ]; then
              echo "[$name] Skipped (could not resolve $branch)."
              continue
            fi

            BASE_TREE=$(gh api "repos/${OWNER}/${name}/git/commits/${HEAD_SHA}" --jq '.tree.sha')
            RAW_TREE=$(gh api "repos/${OWNER}/${name}/git/trees/${BASE_TREE}")

            # Check for non-gitlink collision on AVIS-DATALAKE path
            COLLISION=$(echo "$RAW_TREE" | jq -r '.tree[] | select(.path == "AVIS-DATALAKE" and .mode != "160000") | .mode')
            if [ -n "$COLLISION" ]; then
              echo "[$name] ERROR: Path 'AVIS-DATALAKE' already exists as mode $COLLISION."
              FAILED_COUNT=$((FAILED_COUNT + 1))
              continue
            fi

            CURRENT_LINK_SHA=$(echo "$RAW_TREE" | jq -r '.tree[] | select(.path == "AVIS-DATALAKE" and .mode == "160000") | .sha')

            # Build .gitmodules preserving any existing submodules
            EXISTING_GM=$(gh api "repos/${OWNER}/${name}/contents/.gitmodules?ref=${branch}" \
              --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || true)

            if [ -n "$EXISTING_GM" ]; then
              CLEAN_GM=$(printf '%s\n' "$EXISTING_GM" | awk '
                BEGIN { skip = 0 }
                /^\[submodule "AVIS-DATALAKE"\]/ { skip = 1; next }
                /^\[submodule / { skip = 0 }
                !skip { print }
              ')
              NEW_GM=$(printf '%s\n\n%s\n' "$CLEAN_GM" "$GM_BLOCK" | sed '/./,$!d')
            else
              NEW_GM=$(printf '%s\n' "$GM_BLOCK")
            fi

            # Ensure _config.yml excludes AVIS-DATALAKE/ and .gitmodules so Jekyll/Pages builds cleanly
            EXISTING_CFG=$(gh api "repos/${OWNER}/${name}/contents/_config.yml?ref=${branch}" \
              --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || true)

            if [ -z "$EXISTING_CFG" ]; then
              NEW_CFG=$'exclude:\n  - .github/\n  - .gitmodules\n  - AVIS-DATALAKE/\n'
            elif printf '%s\n' "$EXISTING_CFG" | grep -q '^exclude:'; then
              NEW_CFG="$EXISTING_CFG"
              printf '%s\n' "$NEW_CFG" | grep -q 'AVIS-DATALAKE/' || \
                NEW_CFG=$(printf '%s\n' "$NEW_CFG" | sed '/^exclude:/a\  - AVIS-DATALAKE/')
              printf '%s\n' "$NEW_CFG" | grep -q '\.gitmodules' || \
                NEW_CFG=$(printf '%s\n' "$NEW_CFG" | sed '/^exclude:/a\  - .gitmodules')
            else
              NEW_CFG=$(printf '%s\n\nexclude:\n  - .github/\n  - .gitmodules\n  - AVIS-DATALAKE/\n' "$EXISTING_CFG")
            fi

            # Skip commit if link SHA, .gitmodules, and _config.yml are already exact
            if [ "$CURRENT_LINK_SHA" = "$TARGET_SHA" ] && [ "$EXISTING_GM" = "$NEW_GM" ] && [ "$EXISTING_CFG" = "$NEW_CFG" ]; then
              echo "[$name] OK (already up to date) -> $TARGET_SHA"
              OK_COUNT=$((OK_COUNT + 1))
              continue
            fi

            # Rebuild root tree preserving all existing files while setting the 1 AVIS-DATALAKE link
            CLEAN_TREE=$(echo "$RAW_TREE" | jq \
              --arg tsha "$TARGET_SHA" \
              --arg gm "$NEW_GM" \
              --arg cfg "$NEW_CFG" \
              '[.tree[] | select(.path != "AVIS-DATALAKE" and .path != ".gitmodules" and .path != "_config.yml" and .path != "AVIS-DATALAKE.md") | {path, mode, type, sha}]
               + [
                 { path: "AVIS-DATALAKE", mode: "160000", type: "commit", sha: $tsha },
                 { path: ".gitmodules", mode: "100644", type: "blob", content: $gm },
                 { path: "_config.yml", mode: "100644", type: "blob", content: $cfg }
               ]')

            NEW_TREE=$(jq -n --argjson tree "$CLEAN_TREE" '{ tree: $tree }' | \
              gh api "repos/${OWNER}/${name}/git/trees" --input - --jq '.sha' 2>/dev/null || true)
            if [ -z "$NEW_TREE" ]; then
              echo "[$name] ERROR creating Git tree."
              FAILED_COUNT=$((FAILED_COUNT + 1))
              continue
            fi

            NEW_COMMIT=$(jq -n \
              --arg msg "Link AVIS-DATALAKE folder into repository" \
              --arg tree "$NEW_TREE" \
              --arg parent "$HEAD_SHA" \
              '{ message: $msg, tree: $tree, parents: [$parent] }' | \
              gh api "repos/${OWNER}/${name}/git/commits" --input - --jq '.sha' 2>/dev/null || true)
            if [ -z "$NEW_COMMIT" ]; then
              echo "[$name] ERROR creating commit."
              FAILED_COUNT=$((FAILED_COUNT + 1))
              continue
            fi

            # Attempt direct ref update; fall back to PR if branch protection or workflow scope blocks direct push
            if ! PATCH_ERR=$(gh api -X PATCH "repos/${OWNER}/${name}/git/refs/heads/${branch}" -f sha="$NEW_COMMIT" 2>&1); then
              echo "[$name] Direct PATCH blocked ($PATCH_ERR) -> trying PR fallback..."
              PR_BRANCH="chore/link-avis-datalake"
              gh api -X POST "repos/${OWNER}/${name}/git/refs" \
                -f ref="refs/heads/${PR_BRANCH}" \
                -f sha="$NEW_COMMIT" >/dev/null 2>&1 || \
              gh api -X PATCH "repos/${OWNER}/${name}/git/refs/heads/${PR_BRANCH}" \
                -f sha="$NEW_COMMIT" -F force=true >/dev/null 2>&1 || true

              PR_URL=$(gh pr create --repo "${OWNER}/${name}" \
                --base "$branch" \
                --head "$PR_BRANCH" \
                --title "Link AVIS-DATALAKE folder into repository" \
                --body "Automated callback link to AVIS-DATALAKE @ ${TARGET_SHA}" 2>/dev/null || true)

              if [ -n "$PR_URL" ]; then
                gh pr merge "$PR_URL" --merge --delete-branch >/dev/null 2>&1 || true
                echo "[$name] PR created/merged -> $PR_URL"
              else
                echo "[$name] ERROR: Failed both direct PATCH and PR fallback ($PATCH_ERR)"
                FAILED_COUNT=$((FAILED_COUNT + 1))
                continue
              fi
            fi

            # Strict post-commit verification against live branch tree
            LIVE_HEAD=$(gh api "repos/${OWNER}/${name}/git/ref/heads/${branch}" --jq '.object.sha')
            LIVE_TREE_SHA=$(gh api "repos/${OWNER}/${name}/git/commits/${LIVE_HEAD}" --jq '.tree.sha')
            VERIFY_SHA=$(gh api "repos/${OWNER}/${name}/git/trees/${LIVE_TREE_SHA}" --jq '.tree[] | select(.path == "AVIS-DATALAKE" and .mode == "160000") | .sha')

            if [ "$VERIFY_SHA" = "$TARGET_SHA" ]; then
              echo "[$name] VERIFIED -> AVIS-DATALAKE @ $VERIFY_SHA ($branch)"
              UPDATED_COUNT=$((UPDATED_COUNT + 1))
            else
              echo "[$name] FAIL: Live verification mismatch (expected $TARGET_SHA, got ${VERIFY_SHA:-none})"
              FAILED_COUNT=$((FAILED_COUNT + 1))
            fi
          done <<< "$REPO_ROWS"

          echo "Summary: ${UPDATED_COUNT} installed/updated, ${OK_COUNT} already current, ${FAILED_COUNT} failed."
          if [ "$FAILED_COUNT" -gt 0 ]; then
            exit 1
          fi
