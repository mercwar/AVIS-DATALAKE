name: Callback - Link AVIS-DATALAKE into Public Repos

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

jobs:
  callback-link-datalake:
    runs-on: ubuntu-latest
    steps:
      - name: Place 1 AVIS-DATALAKE link in each public repo
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Error: GH_PAT secret is missing."
            exit 1
          fi

          DL_URL="https://github.com/mercwar/AVIS-DATALAKE.git"
          DL_SHA=$(gh api "repos/mercwar/AVIS-DATALAKE/git/ref/heads/main" --jq '.object.sha')
          echo "AVIS-DATALAKE main SHA: $DL_SHA"

          gh repo list mercwar \
            --visibility public \
            --limit 200 \
            --json name,defaultBranchRef,isEmpty,isArchived \
            --jq '.[] | select(.name != "AVIS-DATALAKE" and .isEmpty == false and .isArchived == false) | "\(.name) \(.defaultBranchRef.name)"' \
          | while read -r name branch; do
              [ -z "$branch" ] || [ "$branch" = "null" ] && continue

              HEAD_SHA=$(gh api "repos/mercwar/${name}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null) || {
                echo "[$name] Skipped (could not read $branch)."
                continue
              }
              BASE_TREE=$(gh api "repos/mercwar/${name}/git/commits/${HEAD_SHA}" --jq '.tree.sha')

              EXISTING_SHA=$(gh api "repos/mercwar/${name}/git/trees/${BASE_TREE}" \
                --jq '.tree[] | select(.path == "AVIS-DATALAKE") | .sha' 2>/dev/null || true)

              GITMODULES=$(gh api "repos/mercwar/${name}/contents/.gitmodules?ref=${branch}" \
                --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || true)

              NEEDS_GM=false
              if ! echo "$GITMODULES" | grep -q "url = ${DL_URL}"; then
                CLEAN_GM=$(echo "$GITMODULES" | awk '
                  /^\[submodule "AVIS-DATALAKE"\]/ { skip=1; next }
                  /^\[/ { skip=0 }
                  !skip { print }
                ')
                if [ -n "$(echo "$CLEAN_GM" | tr -d '[:space:]')" ]; then
                  GITMODULES=$(printf '%s\n[submodule "AVIS-DATALAKE"]\n\tpath = AVIS-DATALAKE\n\turl = %s\n\tbranch = main\n\tshallow = true\n' "$CLEAN_GM" "$DL_URL")
                else
                  GITMODULES=$(printf '[submodule "AVIS-DATALAKE"]\n\tpath = AVIS-DATALAKE\n\turl = %s\n\tbranch = main\n\tshallow = true\n' "$DL_URL")
                fi
                NEEDS_GM=true
              fi

              CFG=$(gh api "repos/mercwar/${name}/contents/_config.yml?ref=${branch}" \
                --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || true)

              NEEDS_CFG=false
              if [ -z "$CFG" ]; then
                CFG=$(printf 'exclude:\n  - AVIS-DATALAKE\n')
                NEEDS_CFG=true
              elif ! echo "$CFG" | grep -q 'AVIS-DATALAKE'; then
                if echo "$CFG" | grep -q '^exclude:'; then
                  CFG=$(echo "$CFG" | sed '/^exclude:/a\  - AVIS-DATALAKE')
                else
                  CFG=$(printf '%s\n\nexclude:\n  - AVIS-DATALAKE\n' "$CFG")
                fi
                NEEDS_CFG=true
              fi

              if [ "$EXISTING_SHA" = "$DL_SHA" ] && [ "$NEEDS_GM" = "false" ] && [ "$NEEDS_CFG" = "false" ]; then
                echo "[$name] Already linked on $branch."
                continue
              fi

              TREE_ITEMS=$(jq -n \
                --arg gm "$GITMODULES" \
                --arg sha "$DL_SHA" \
                '[
                  { path: ".gitmodules", mode: "100644", type: "blob", content: $gm },
                  { path: "AVIS-DATALAKE", mode: "160000", type: "commit", sha: $sha }
                ]')

              if [ "$NEEDS_CFG" = "true" ]; then
                TREE_ITEMS=$(echo "$TREE_ITEMS" | jq \
                  --arg cfg "$CFG" \
                  '. + [{ path: "_config.yml", mode: "100644", type: "blob", content: $cfg }]')
              fi

              NEW_TREE=$(jq -n \
                --arg base "$BASE_TREE" \
                --argjson tree "$TREE_ITEMS" \
                '{ base_tree: $base, tree: $tree }' | \
                gh api "repos/mercwar/${name}/git/trees" --input - --jq '.sha') || {
                  echo "[$name] ERROR creating tree."
                  continue
                }

              NEW_COMMIT=$(jq -n \
                --arg msg "Link AVIS-DATALAKE folder" \
                --arg tree "$NEW_TREE" \
                --arg parent "$HEAD_SHA" \
                '{ message: $msg, tree: $tree, parents: [$parent] }' | \
                gh api "repos/mercwar/${name}/git/commits" --input - --jq '.sha') || {
                  echo "[$name] ERROR creating commit."
                  continue
                }

              if gh api -X PATCH "repos/mercwar/${name}/git/refs/heads/${branch}" -f sha="$NEW_COMMIT" >/dev/null; then
                echo "[$name] SUCCESS -> Linked AVIS-DATALAKE on $branch ($NEW_COMMIT)"
              else
                echo "[$name] ERROR updating $branch (check GH_PAT permissions)."
              fi
            done
