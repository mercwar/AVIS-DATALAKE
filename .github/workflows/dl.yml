name: Link All Mercwar Repos into AVIS-DATALAKE

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sync-datalake-folders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mercwar/AVIS-DATALAKE
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Link all mercwar repositories and forks
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Error: GH_PAT secret is missing."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git config --global url."https://x-access-token:${GH_TOKEN}@://github.com".insteadOf "https://://github.com"

          gh repo list mercwar \
            --limit 200 \
            --json name,url,defaultBranchRef,isEmpty \
            --jq '.[] | select(.name != "AVIS-DATALAKE" and .isEmpty == false) | "\(.name) \(.url) \(.defaultBranchRef.name)"' \
          | while read -r name url branch; do
              if [ -n "$branch" ] && [ "$branch" != "null" ]; then
                if ! git config -f .gitmodules --get "submodule.${name}.url" >/dev/null 2>&1; then
                  git submodule add -f -b "$branch" "$url" "$name" || true
                fi
              fi
            done

          git submodule sync --recursive
          git submodule update --init --recursive --remote || true

          # Auto-exclude all submodule folders from Jekyll so GitHub Pages never crashes on symlinks
          {
            echo "exclude:"
            echo "  - .github/"
            echo "  - .gitmodules"
            if [ -f .gitmodules ]; then
              git config -f .gitmodules --get-regexp path | awk '{print "  - " $2 "/"}'
            fi
          } > _config.yml

          git add -A
          git commit -m "Link mercwar repositories into AVIS-DATALAKE" || exit 0
          git push
