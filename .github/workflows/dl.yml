name: Link Public Repos & Deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Generate repo redirect folders
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          OWNER="mercwar"

          rm -rf _site
          mkdir -p _site

          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>AVIS DATALAKE</title>
          </head>
          <body>
            <h1>Public Repositories</h1>
            <ul>
          HTML

          gh repo list "$OWNER" \
            --visibility public \
            --limit 500 \
            --json name,isArchived,isPrivate,isEmpty,url \
            --jq '.[] | select(.isPrivate==false and .isArchived==false and .isEmpty==false)' |
          jq -c . |
          while read repo; do

            NAME=$(echo "$repo" | jq -r '.name')
            URL=$(echo "$repo" | jq -r '.url')

            mkdir -p "_site/$NAME"

            cat > "_site/$NAME/index.html" <<HTML
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0; url=$URL">
            <script>
              window.location.replace("$URL");
            </script>
          </head>
          <body>
            Redirecting to
            <a href="$URL">$URL</a>
          </body>
          </html>
          HTML

            echo "<li><a href=\"./$NAME/\">$NAME</a></li>" >> _site/index.html

          done

          cat >> _site/index.html <<'HTML'
            </ul>
          </body>
          </html>
          HTML

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
